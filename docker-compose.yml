  # # Postgres DB
  db:
    container_name: atrupe_db_dev
    image: postgres:14.1-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    networks:
      - docker_workspace_network
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  db:
    driver: local

networks:
  docker_workspace_network:
    driver: bridge
