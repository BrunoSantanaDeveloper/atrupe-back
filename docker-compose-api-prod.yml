version: "3.8"

services:
  atrupe:
    image: atrupe-image:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.atrupe-prod.rule=Host(`api.atrupe.com.br`)"
        - "traefik.http.routers.atrupe-prod.entrypoints=websecure"
        - "traefik.http.routers.atrupe-prod.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.atrupe-prod.priority=1"
        - "traefik.http.routers.atrupe-prod.service=atrupe-prod"
        - "traefik.http.services.atrupe-prod.loadbalancer.server.port=5000"
        - "traefik.http.services.atrupe-prod.loadbalancer.passhostheader=true"
        - "traefik.http.middlewares.sslheader-prod.headers.customrequestheaders.X-Forwarded-Proto=https"
        - "traefik.http.routers.atrupe-prod.middlewares=sslheader-prod@docker"
    networks:
      - atrupe_network
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://AtrupeAdminMaster:9Vb^6oo4@yy;&G62w07@atrupe-postgres:5432/atrupeDb

networks:
  atrupe_network:
    external: true

