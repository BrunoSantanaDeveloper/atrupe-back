# Docker Swarm Stack — Ambiente DEV
# Deploy: docker stack deploy -c docker-stack.dev.yml atrupe-dev --with-registry-auth
#
# NOTA: O .env deve estar em /home/ubuntu/atrupe-back/.env no VPS antes do deploy.
# A rede 'atrupe-dev_net' é criada automaticamente na primeira execução.
# O postgres (atrupe-postgres-dev) deve estar na mesma rede overlay para ser resolvível.

version: '3.8'

services:
  atrupe:
    image: atrupe-image-dev:latest
    env_file:
      - /home/ubuntu/atrupe-back/.env
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: ingress
    networks:
      - atrupe-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback   # volta versão anterior automaticamente em caso de falha
        order: start-first         # sobe novo container ANTES de matar o antigo (zero downtime)
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # tempo para migrations rodarem antes de começar a monitorar

networks:
  atrupe-net:
    driver: overlay
    attachable: true
    # Se o postgres estiver em outra stack/rede, adicione o nome correto abaixo:
    # external: true
    # name: nome-da-rede-existente
