

version: '3.8'

services:
  atrupe-postgres:
    image: postgres:14
    environment:
        - POSTGRES_DB=atrupeDb
        - POSTGRES_USER=AtrupeAdminMaster
        - POSTGRES_PASSWORD=9Vb^6oo4@yy;&G62w07
    networks:
      - atrupe_network
    ports:
      - 5432:5432  # Porta externa diferente
    volumes:
      - postgres_data_atrupe:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

volumes:
  postgres_data_atrupe:
    external: true
    name: postgres_data_atrupe

networks:
  atrupe_network:
    external: true
    name: atrupe_network