version: "3.8"

services:
  # Base de dados PostgreSQL local
  postgres:
    image: postgres:15
    container_name: atrupe-postgres
    restart: always
    environment:
      POSTGRES_USER: atrupedev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: atrupeDevDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atrupe-dev

  # API NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: atrupe-api
    restart: always
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://atrupedev:dev123@postgres:5432/atrupeDevDb?schema=public
      - JWT_SECRET=dev-jwt-secret
      - SECRET=dev-secret
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    networks:
      - atrupe-dev
    command: npm run start:dev

  # MinIO para storage local (opcional)
  minio:
    image: minio/minio:latest
    container_name: atrupe-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - atrupe-dev
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:

networks:
  atrupe-dev:
    driver: bridge 