version: '3.8'

services:
  atrupe:
    image: atrupe-app:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.atrupe.rule=Host(`dev.atrupe.com.br`)'
        - 'traefik.http.routers.atrupe.entrypoints=websecure'
        - 'traefik.http.routers.atrupe.tls.certresolver=letsencryptresolver'
        - 'traefik.http.routers.atrupe.priority=1'
        - 'traefik.http.routers.atrupe.service=atrupe'
        - 'traefik.http.services.atrupe.loadbalancer.server.port=5000'
        - 'traefik.http.services.atrupe.loadbalancer.passhostheader=true'
        - 'traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https'
        - 'traefik.http.routers.atrupe.middlewares=sslheader@docker'
    networks:
      - atrupe_network
    environment:
      - NODE_ENV=production
      - PORT=5000

networks:
  atrupe_network:
    external: true
