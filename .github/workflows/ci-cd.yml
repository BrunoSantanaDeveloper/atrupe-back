name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test

  deploy-homolog:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/atrupe-back && git config --global --add safe.directory /home/ubuntu/atrupe-back && git stash && git checkout dev && git fetch origin dev && git reset --hard origin/dev && docker system prune -af --volumes && docker build --no-cache --cpu-quota=50000 --memory=512m . -t atrupe-image-dev:latest && docker service update --image atrupe-image-dev:latest atrupe-dev_atrupe --force

  smoke-test-homolog:
    needs: deploy-homolog
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Homologação)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          # Pode adicionar API_URL aqui caso não use o default no script
        run: |
          Start-Sleep -Seconds 15
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Homologação (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }

  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/atrupe-back && git config --global --add safe.directory /home/ubuntu/atrupe-back && git stash && git checkout main && git fetch origin main && git reset --hard origin/main && docker system prune -af --volumes && docker build --no-cache --cpu-quota=50000 --memory=512m . -t atrupe-image:latest && docker service update --image atrupe-image:latest atrupe-api_atrupe --force

  smoke-test-prod:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Produção)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          API_URL: ${{ secrets.PROD_API_URL || 'https://api.atrupe.com.br' }}
        run: |
          Start-Sleep -Seconds 30
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Produção (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }
