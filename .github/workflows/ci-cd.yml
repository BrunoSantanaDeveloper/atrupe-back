name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test

  deploy-homolog:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # === BACKUP DO BANCO ANTES DO DEPLOY ===
            BACKUP_DIR=/home/ubuntu/db-backups/dev
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql"
            POSTGRES_CONTAINER=$(docker ps --filter name=postgres --format '{{.Names}}' | grep dev | head -1)
            if [ -n "$POSTGRES_CONTAINER" ]; then
              DB_USER=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_USER | cut -d= -f2 | tr -d '[:space:]')
              DB_NAME=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_DB | cut -d= -f2 | tr -d '[:space:]')
              docker exec "$POSTGRES_CONTAINER" pg_dump -U "${DB_USER:-postgres}" "${DB_NAME:-atrupeDbDev}" > "$BACKUP_FILE" \
                && echo "✅ Backup salvo: $BACKUP_FILE" \
                || echo "⚠️  Backup falhou — continuando deploy..."
              ls -t "$BACKUP_DIR"/backup-*.sql 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            else
              echo "⚠️  Container postgres (dev) não encontrado — backup pulado..."
            fi
            # === DEPLOY ===
            cd /home/ubuntu/atrupe-back && \
            git config --global --add safe.directory /home/ubuntu/atrupe-back && \
            git stash && \
            git checkout dev && \
            git fetch origin dev && \
            git reset --hard origin/dev && \
            docker build --no-cache --cpu-quota=50000 --memory=1g . -t atrupe-image-dev:latest && \
            (docker service ls --format '{{.Name}}' | grep -q "^atrupe-dev_atrupe$" && \
              docker service update --image atrupe-image-dev:latest atrupe-dev_atrupe --force || \
              docker service create --name atrupe-dev_atrupe --network atrupe_network -p 5000:5000 --limit-memory 512m --env-file /home/ubuntu/atrupe-back/.env.dev --restart-condition on-failure atrupe-image-dev:latest) && \
            docker image prune -f

  smoke-test-homolog:
    needs: deploy-homolog
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Homologação)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          # Pode adicionar API_URL aqui caso não use o default no script
        run: |
          Start-Sleep -Seconds 15
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Homologação (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }

  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # === BACKUP DO BANCO ANTES DO DEPLOY ===
            BACKUP_DIR=/home/ubuntu/db-backups/prod
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql"
            POSTGRES_CONTAINER=$(docker ps --filter name=postgres --format '{{.Names}}' | grep -v dev | head -1)
            if [ -n "$POSTGRES_CONTAINER" ]; then
              DB_USER=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_USER | cut -d= -f2 | tr -d '[:space:]')
              DB_NAME=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_DB | cut -d= -f2 | tr -d '[:space:]')
              docker exec "$POSTGRES_CONTAINER" pg_dump -U "${DB_USER:-postgres}" "${DB_NAME:-atrupeDb}" > "$BACKUP_FILE" \
                && echo "✅ Backup salvo: $BACKUP_FILE" \
                || echo "⚠️  Backup falhou — continuando deploy..."
              ls -t "$BACKUP_DIR"/backup-*.sql 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            else
              echo "⚠️  Container postgres (prod) não encontrado — backup pulado..."
            fi
            # === DEPLOY ===
            cd /home/ubuntu/atrupe-back && \
            git config --global --add safe.directory /home/ubuntu/atrupe-back && \
            git stash && \
            git checkout main && \
            git fetch origin main && \
            git reset --hard origin/main && \
            docker build --no-cache --cpu-quota=50000 --memory=1g . -t atrupe-image:latest && \
            (docker service ls --format '{{.Name}}' | grep -q "^atrupe-api_atrupe$" && \
              docker service update --image atrupe-image:latest atrupe-api_atrupe --force || \
              docker service create --name atrupe-api_atrupe --network atrupe_network -p 5000:5000 --limit-memory 512m --env-file /home/ubuntu/atrupe-back/.env.prod --restart-condition on-failure atrupe-image:latest) && \
            docker image prune -f

  smoke-test-prod:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Produção)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          API_URL: ${{ secrets.PROD_API_URL || 'https://api.atrupe.com.br' }}
        run: |
          Start-Sleep -Seconds 30
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Produção (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }
