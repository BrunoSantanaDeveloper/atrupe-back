name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test

  build-image-homolog:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case owner and repo names
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (homolog)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-homolog:
    needs: build-image-homolog
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set lower case owner and repo names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${IMAGE_NAME,,}" >> ${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GHCR_PAT,GHCR_USER,GHCR_IMAGE
          script: |
            set -Eeuo pipefail

            wait_for_service() {
              SERVICE_NAME="$1"
              TIMEOUT_SECONDS="${2:-240}"
              END_TIME=$((SECONDS + TIMEOUT_SECONDS))

              while [ "$SECONDS" -lt "$END_TIME" ]; do
                UPDATE_STATE=$(docker service inspect "$SERVICE_NAME" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}')
                REPLICAS=$(docker service ls --filter "name=$SERVICE_NAME" --format '{{.Replicas}}' | head -1)
                RUNNING_REPLICAS="${REPLICAS%/*}"
                DESIRED_REPLICAS="${REPLICAS#*/}"

                if [ "$UPDATE_STATE" = "completed" ] && [ "$RUNNING_REPLICAS" = "$DESIRED_REPLICAS" ] && [ "$DESIRED_REPLICAS" != "0" ]; then
                  echo "Service $SERVICE_NAME updated successfully ($REPLICAS)."
                  return 0
                fi

                if echo "$UPDATE_STATE" | grep -Eq 'rollback|paused'; then
                  echo "Service $SERVICE_NAME update failed with state: $UPDATE_STATE"
                  docker service ps "$SERVICE_NAME" --no-trunc
                  return 1
                fi

                sleep 5
              done

              echo "Timed out waiting for $SERVICE_NAME to converge."
              docker service ps "$SERVICE_NAME" --no-trunc
              return 1
            }

            free_disk_if_needed() {
              AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
              MIN_AVAILABLE_KB=5242880

              if [ "$AVAILABLE_KB" -lt "$MIN_AVAILABLE_KB" ]; then
                echo "Less than 5 GB free on /. Pruning Docker build cache before pulling the image."
                docker builder prune -af || true
              fi
            }

            # === BACKUP DO BANCO ANTES DO DEPLOY ===
            BACKUP_DIR=/home/ubuntu/db-backups/dev
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql.gz"
            POSTGRES_CONTAINER=$(docker ps --filter name=postgres --format '{{.Names}}' | grep dev | head -1 || true)
            if [ -n "$POSTGRES_CONTAINER" ]; then
              DB_USER=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_USER | cut -d= -f2 | tr -d '[:space:]' || true)
              DB_NAME=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_DB | cut -d= -f2 | tr -d '[:space:]' || true)
              docker exec "$POSTGRES_CONTAINER" pg_dump -U "${DB_USER:-postgres}" "${DB_NAME:-atrupeDbDev}" | gzip -c > "$BACKUP_FILE" \
                && echo "✅ Backup salvo: $BACKUP_FILE" \
                || echo "⚠️  Backup falhou — continuando deploy..."
              ls -t "$BACKUP_DIR"/backup-*.sql.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            else
              echo "⚠️  Container postgres (dev) não encontrado — backup pulado..."
            fi
            # === ATUALIZAR REPOSITÓRIO LOCAL NA VPS ===
            cd /home/ubuntu/atrupe-back || exit 1
            git fetch origin
            git checkout dev
            git pull --ff-only

            # === DEPLOY VIA DOCKER STACK ===
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            free_disk_if_needed
            docker pull "$GHCR_IMAGE":dev
            export GHCR_IMAGE="$GHCR_IMAGE"
            python3 scripts/prepare-stack.py docker-stack.dev.yml /home/ubuntu/atrupe-back/.env.dev | docker stack deploy -c - atrupe-dev --with-registry-auth
            wait_for_service atrupe-dev_atrupe 240
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}

  smoke-test-homolog:
    needs: deploy-homolog
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Homologação)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          API_URL: https://dev.atrupe.com.br
        run: |
          Start-Sleep -Seconds 60
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Homologação (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }

  build-image-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case owner and repo names
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-image-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set lower case owner and repo names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${IMAGE_NAME,,}" >> ${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GHCR_PAT,GHCR_USER,GHCR_IMAGE
          script: |
            set -Eeuo pipefail

            wait_for_service() {
              SERVICE_NAME="$1"
              TIMEOUT_SECONDS="${2:-240}"
              END_TIME=$((SECONDS + TIMEOUT_SECONDS))

              while [ "$SECONDS" -lt "$END_TIME" ]; do
                UPDATE_STATE=$(docker service inspect "$SERVICE_NAME" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}')
                REPLICAS=$(docker service ls --filter "name=$SERVICE_NAME" --format '{{.Replicas}}' | head -1)
                RUNNING_REPLICAS="${REPLICAS%/*}"
                DESIRED_REPLICAS="${REPLICAS#*/}"

                if [ "$UPDATE_STATE" = "completed" ] && [ "$RUNNING_REPLICAS" = "$DESIRED_REPLICAS" ] && [ "$DESIRED_REPLICAS" != "0" ]; then
                  echo "Service $SERVICE_NAME updated successfully ($REPLICAS)."
                  return 0
                fi

                if echo "$UPDATE_STATE" | grep -Eq 'rollback|paused'; then
                  echo "Service $SERVICE_NAME update failed with state: $UPDATE_STATE"
                  docker service ps "$SERVICE_NAME" --no-trunc
                  return 1
                fi

                sleep 5
              done

              echo "Timed out waiting for $SERVICE_NAME to converge."
              docker service ps "$SERVICE_NAME" --no-trunc
              return 1
            }

            free_disk_if_needed() {
              AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 { print $4 }')
              MIN_AVAILABLE_KB=5242880

              if [ "$AVAILABLE_KB" -lt "$MIN_AVAILABLE_KB" ]; then
                echo "Less than 5 GB free on /. Pruning Docker build cache before pulling the image."
                docker builder prune -af || true
              fi
            }

            # === BACKUP DO BANCO ANTES DO DEPLOY ===
            BACKUP_DIR=/home/ubuntu/db-backups/prod
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql.gz"
            POSTGRES_CONTAINER=$(docker ps --filter name=postgres --format '{{.Names}}' | grep -v dev | head -1 || true)
            if [ -n "$POSTGRES_CONTAINER" ]; then
              DB_USER=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_USER | cut -d= -f2 | tr -d '[:space:]' || true)
              DB_NAME=$(docker exec "$POSTGRES_CONTAINER" env | grep POSTGRES_DB | cut -d= -f2 | tr -d '[:space:]' || true)
              docker exec "$POSTGRES_CONTAINER" pg_dump -U "${DB_USER:-postgres}" "${DB_NAME:-atrupeDb}" | gzip -c > "$BACKUP_FILE" \
                && echo "✅ Backup salvo: $BACKUP_FILE" \
                || echo "⚠️  Backup falhou — continuando deploy..."
              ls -t "$BACKUP_DIR"/backup-*.sql.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            else
              echo "⚠️  Container postgres (prod) não encontrado — backup pulado..."
            fi
            # === ATUALIZAR REPOSITÓRIO LOCAL NA VPS ===
            cd /home/ubuntu/atrupe-back || exit 1
            git fetch origin
            git checkout main
            git pull --ff-only

            # === DEPLOY VIA DOCKER STACK ===
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            free_disk_if_needed
            docker pull "$GHCR_IMAGE":latest
            export GHCR_IMAGE="$GHCR_IMAGE"
            python3 scripts/prepare-stack.py docker-stack.prod.yml /home/ubuntu/atrupe-back/.env.prod | docker stack deploy -c - atrupe-api --with-registry-auth
            wait_for_service atrupe-api_atrupe 240
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}

  smoke-test-prod:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Produção)
        shell: pwsh
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          API_URL: ${{ secrets.PROD_API_URL || 'https://api.atrupe.com.br' }}
        run: |
          Start-Sleep -Seconds 30
          pwsh ./smoke-test-homolog.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { $status = "✅ SUCESSO" } else { $status = "❌ FALHA" }
          if ($env:NOTIFICATION_WEBHOOK) { Invoke-RestMethod -Uri $env:NOTIFICATION_WEBHOOK -Method Post -Body (@{content="Pipeline Produção (Atrupe): $status"} | ConvertTo-Json) -ContentType "application/json" }
          if ($exitCode -ne 0) { exit $exitCode }
